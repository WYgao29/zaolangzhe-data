name: pipeline

on:
  schedule:
    - cron: '0 7-12 * * *'  # UTC 07:00-12:00 整点 = 北京 15:00-20:00 每小时，紧跟上游更新
    - cron: '30 13 * * *'   # UTC 13:30 = 北京 21:30 晚间兜底（上游偶尔晚点）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回溯最近 N 天的上游英文快照（0 = 只处理最新快照）'
        default: '0'

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 单写者守卫：本地 launchd 总结任务（15:40-21:40）是数据的日常写入者。
      # 最近 26 小时内有"本地中文总结"推送时，定时归档整体跳过，避免两个写入者
      # 对同一批单行 JSON 分片做 rebase 撞车；Mac 掉线超 26 小时后 Actions 才接管。
      # 手动触发不受守卫限制，便于云端应急回填。
      - name: 本地总结任务活跃时跳过归档
        id: local-writer-guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手动触发：不启用单写者守卫"
            exit 0
          fi
          if [ -n "$(git log -1 --since='26 hours ago' --grep='本地中文总结' --format=%H)" ]; then
            echo "最近 26 小时内有本地总结推送，本地为唯一写入者，跳过本次归档"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "最近无本地总结推送，正常归档"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.local-writer-guard.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: 运行测试
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: npm test

      - name: 运行数据管线
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: node pipeline/process.js --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"

      - name: 校验数据契约
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: npm run validate:data

      - name: 提交数据更新
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: |
          git config user.name "zaolangzhe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无新增内容"
          else
            git commit -m "数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
