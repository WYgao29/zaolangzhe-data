name: pipeline

on:
  schedule:
    - cron: '0 7-12 * * *'  # UTC 07:00-12:00 整点 = 北京 15:00-20:00 每小时，紧跟上游更新
    - cron: '30 13 * * *'   # UTC 13:30 = 北京 21:30 晚间兜底（上游偶尔晚点）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '补加工最近 N 天（0 = 只处理上游最新快照的新增内容）'
        default: '0'

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: 运行测试
        run: npm test

      - name: 运行数据管线
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node pipeline/process.js --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"

      - name: 校验数据契约
        run: npm run validate:data

      - name: 提交数据更新
        run: |
          git config user.name "zaolangzhe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无新增内容"
          else
            git commit -m "数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
