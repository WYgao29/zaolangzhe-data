name: pipeline

# 全本地架构下的应急通道：日常归档与中文总结全部由本地 launchd 任务完成
# （com.zaolangzhe.summarize，北京时间 15:40-21:40 每小时）。
# 仅保留手动触发，用于 Mac 长期不可用时的云端应急回填；
# 单写者守卫对所有事件生效——本地总结活跃时手动触发也会自动跳过。
on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回溯最近 N 天的上游英文快照（0 = 只处理最新快照）'
        default: '0'

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 单写者守卫：本地 launchd 总结任务是数据的日常写入者。
      # 最近 26 小时内有"本地中文总结"推送时，任何云端运行（含手动）都跳过，
      # 避免两个写入者对同一批单行 JSON 分片做 rebase 撞车。
      - name: 本地总结任务活跃时跳过云端运行
        id: local-writer-guard
        run: |
          if [ -n "$(git log -1 --since='26 hours ago' --grep='本地中文总结' --format=%H)" ]; then
            echo "最近 26 小时内有本地总结推送，本地为唯一写入者，跳过云端运行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "最近无本地总结推送，放行应急归档"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.local-writer-guard.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: 运行测试
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: npm test

      - name: 运行数据管线
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: node pipeline/process.js --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"

      - name: 校验数据契约
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: npm run validate:data

      - name: 提交数据更新
        if: steps.local-writer-guard.outputs.skip != 'true'
        run: |
          git config user.name "zaolangzhe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无新增内容"
          else
            git commit -m "数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
