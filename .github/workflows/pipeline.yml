name: pipeline

on:
  schedule:
    - cron: '30 7 * * *'   # UTC 07:30 = 北京 15:30（上游 14:28 更新之后）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '补加工最近 N 天（0 = 只处理上游最新快照的新增内容）'
        default: '0'

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行数据管线
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node pipeline/process.js --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"

      - name: 提交数据更新
        run: |
          git config user.name "zaolangzhe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无新增内容"
          else
            git commit -m "数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
